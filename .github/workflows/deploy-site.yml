# Publishes the notes page at brotobro.hamcodes.com.
#
# Runs on every push to main. GitBook's Git Sync pushes to main whenever you
# edit the book, so an edit in GitBook rebuilds the note cards and puts them
# live on its own. You never touch the site to update the book.
#
# One time setup (see site/README.md):
#   Settings > Secrets and variables > Actions > New repository secret
#     CLOUDFLARE_API_TOKEN    token with the "Cloudflare Pages: Edit" permission
#     CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard URL
name: Deploy notes site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Turn the book's markdown into note cards
        run: node site/build-notes.js

      - name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project create brotobro --production-branch=main || true

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy site --project-name=brotobro --branch=main --commit-dirty=true
